<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#faf9f6">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile.webp' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/profile.webp' | relative_url }}">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('homepage-theme'); } catch (error) {}
      if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#19191e' : '#faf9f6';
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="#about-me" aria-label="Jiahao Wang, back to top">Jiahao Wang<span aria-hidden="true">.</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about-me" class="nav-about" data-section="about-me" aria-current="location">About</a>
        <a href="#news" data-section="news">News</a>
        <a href="#publications" data-section="publications">Publications</a>
        <a href="#experience" data-section="experience">Experience</a>
        <a href="#education" data-section="education">Education</a>
        <a href="https://wang-jiahao.github.io/blog/" target="_blank" rel="noopener noreferrer">Blog <span class="outbound" aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
      </nav>
      <button class="theme-switch" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme" hidden>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 13A8.8 8.8 0 0 1 11 3.3 8.8 8.8 0 1 0 20.7 13Z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main class="site-main" id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <span>{{ site.author.name | escape }} <span class="footer-dot" aria-hidden="true">·</span> Nanjing University</span>
    <a href="#about-me">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
  {% if site.google_analytics_id %}{% include analytics.html %}{% endif %}
</body>
</html>

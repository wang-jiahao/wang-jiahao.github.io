<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMTB 本地实测轨迹</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#172c32;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}a{color:#166f68;text-underline-offset:3px}header{padding:22px 28px;background:#fffefa;border-bottom:1px solid #d9deda}h1{font-size:25px;margin:6px 0}p{margin:6px 0}.muted{font-size:13px;color:#647374}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:14px 28px;border-bottom:1px solid #d9deda}select,input,button{font:inherit;border:1px solid #bfccc6;background:#fffefa;border-radius:5px;padding:6px 10px}button{cursor:pointer;color:#166f68}input[type=number]{width:80px}input[type=checkbox]{width:17px;height:17px;vertical-align:middle}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1500px;margin:auto}nav{padding:15px;position:sticky;top:0;height:calc(100vh - 180px);overflow:auto}nav button{width:100%;text-align:left;margin-bottom:7px;border:0;background:transparent;font-size:12px}nav button.active{color:#fff;background:#172c32}article{padding:25px 32px;min-width:0}h2{font-size:23px;margin:10px 0}h3{font-size:16px;margin:25px 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:580px;overflow:auto;background:#fffefa;border:1px solid #d9deda;padding:18px;border-radius:7px;font:12px/1.7 ui-monospace,monospace}figure{margin:18px 0}img{max-width:100%;max-height:700px;object-fit:contain;background:#172c32}figcaption{font-size:12px;color:#647374}.links{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0}.actions{display:flex;justify-content:space-between;margin:25px 0}.note{border-left:3px solid #166f68;padding:12px 16px;background:#e4efea;font-size:13px}.phase{font-size:12px;padding:3px 8px;border-radius:4px;background:#e4efea}.warning{background:#f5ebdc}.error{color:#9b462d}@media(max-width:750px){header,.controls{padding:16px}.layout{grid-template-columns:1fr}nav{height:auto;max-height:210px;position:static;border-bottom:1px solid #d9deda}article{padding:20px 17px}select{max-width:100%}h1{font-size:22px}}
</style></head><body>
<header><a id="back" href="index.html#mmtb-multicam">← 返回案例</a> · <a href="step_comparison.html">步数对比</a><h1>MMTB 本地实测轨迹</h1><p class="muted">GPT-5.6 Sol / Codex 0.146.0 · 自行安装依赖，整体不限时。以下编号为外层工具调用记录。</p></header>
<div class="controls"><label>案例 <select id="case"><option value="multicam-active-speaker-cut">多机位剪辑</option><option value="piano-practice-feedback">钢琴纠错</option><option value="accessibility-sync-audit">无障碍同步审计</option></select></label><label>调用 <input id="number" type="number" min="1"></label><button id="go">跳转</button><label><input id="key" type="checkbox" checked> 仅显示关键调用</label></div>
<div class="layout"><nav id="nav" aria-label="工具调用列表"></nav><article id="main">加载轨迹…</article></div>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ids=['multicam-active-speaker-cut','piano-practice-feedback','accessibility-sync-audit'],cache={};let token=0;
async function render(){const request=++token;const parts=location.hash.slice(1).split('/'),task=ids.includes(parts[0])?parts[0]:ids[0];
 try{if(!cache[task]){const response=await fetch(`research/mmtb/local_runs/${task}/trace.json`);if(!response.ok)throw new Error(`HTTP ${response.status}`);cache[task]=await response.json()}if(request!==token)return;const c=cache[task],n=Math.min(c.calls.length,Math.max(1,Number(parts[1])||1)),s=c.calls[n-1];
 document.getElementById('case').value=task;document.getElementById('number').value=n;document.getElementById('number').max=c.calls.length;document.getElementById('back').href='index.html#'+c.case_id;
 const shown=document.getElementById('key').checked?c.calls.filter(x=>c.key_calls.includes(x.id)||x.id===n):c.calls;
 document.getElementById('nav').innerHTML=shown.map(x=>`<button data-number="${x.id}" class="${x.id===n?'active':''}">调用 ${x.id} · ${E(x.name)}${x.wait?' · 等待/轮询':''}<br>${E(x.phase==='interrupted'?'中断前':'完成段')} · ${x.operations} 个工具操作</button>`).join('');document.querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>location.hash=task+'/'+b.dataset.number);
 let body=`<div class="muted">${E(c.title)}<br>${c.counts.responses} 次完成的模型响应 · ${c.calls.length} 条外层调用 · 展开后 ${c.counts.expanded_tools} 次操作 · 本地评分 ${c.score.toFixed(4)} / ${c.passed?'通过':'未通过'}</div><h2>工具调用 #${n}</h2><span class="phase ${s.phase==='interrupted'?'warning':''}">${s.phase==='interrupted'?'网络中断前':'完成段'}</span><p class="muted">${E(new Date(s.timestamp).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}（北京时间） · ${E(s.call_id)}</p>`;
 if(s.messages.length)body+=`<h3>模型公开消息</h3><pre>${E(s.messages.join('\n\n'))}</pre>`;
 body+=`<h3>工具调用原文</h3><pre>${E(s.input)}</pre><h3>工具返回</h3><pre>${E(s.output||'无文本返回；请查看图像或原始记录。')}</pre>`;
 body+=s.images.map((url,i)=>`<figure><a href="${E(url)}" target="_blank"><img src="${E(url)}" alt="调用 ${n} 返回的第 ${i+1} 张图"></a><figcaption>模型实际接收的图像 ${i+1}</figcaption></figure>`).join('');
 body+=`<div class="actions"><button id="prev">← 上一调用</button><button id="next">下一调用 →</button></div><div class="note">${E(c.counts.note)}。网络请求重试不计为工具调用；等待与进程轮询在步数对比中单列。JSONL 为公开导出，已省略加密推理字段，此浏览器整理展示公开消息、工具输入、返回和图像。</div><div class="links">${c.raw_links.map(l=>`<a href="${E(l.url)}" download>${E(l.label)} ↓</a>`).join('')}<a href="research/mmtb/local_runs/${task}/details.json" target="_blank">逐项评分 ↗</a></div>`;
 document.getElementById('main').innerHTML=body;document.getElementById('prev').onclick=()=>location.hash=task+'/'+Math.max(1,n-1);document.getElementById('next').onclick=()=>location.hash=task+'/'+Math.min(c.calls.length,n+1);document.title=`MMTB 调用 ${n} · ${c.title}`;
 }catch(error){document.getElementById('main').innerHTML=`<p class="error">轨迹加载失败：${E(error.message)}。请通过本地网页服务打开此页。</p>`}}
document.getElementById('case').onchange=e=>location.hash=e.target.value+'/1';document.getElementById('go').onclick=()=>location.hash=document.getElementById('case').value+'/'+document.getElementById('number').value;document.getElementById('number').onkeydown=e=>{if(e.key==='Enter')document.getElementById('go').click()};document.getElementById('key').onchange=render;window.addEventListener('hashchange',render);render();
</script></body></html>

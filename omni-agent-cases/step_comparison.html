</style></head><body><main><a href="index.html#mmtb-multicam">← 返回案例</a><h1>MMTB 与 ALE：Agent 配置、工具操作与得分</h1><p>三条 MMTB 本地不限时运行，与三条 ALE 官方公开轨迹；均值按三道题等权计算。</p>
<div class="tablewrap"><table><thead><tr><th>Benchmark / 案例</th><th>Agent 配置</th><th class="num">工具操作</th><th class="num">得分</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted">工具操作按展开后的工具层计数，包含等待/轮询。MMTB 第一题含网络中断与恢复，导入历史未重复计数。</p>
<p class="muted">得分均值为所选三题得分的算术平均。各题评分规则、Agent 配置及预算不同，仅作这组案例的描述性统计，不代表整个 benchmark 的成绩或难度排名。</p>
<div class="links"><a href="MMTB_ALE_六题步数对比.csv" download>下载对比表 CSV ↓</a><a href="research/step_comparison/six_case_comparison.json" target="_blank">统计 JSON ↗</a><a href="mmtb_traces.html">MMTB 工具轨迹 ↗</a><a href="ale_traces.html">ALE 官方轨迹 ↗</a></div>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('research/step_comparison/six_case_comparison.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
 document.getElementById('rows').innerHTML=['MMTB','ALE'].map(b=>d.rows.filter(r=>r.benchmark===b).map(r=>`<tr><td><a href="index.html#${E(r.case_id)}">${E(b)} / ${E(r.case)}</a></td><td>${E(r.agent_config)}</td><td class="num">${r.expanded_tools}</td><td class="num">${r.score.toFixed(4)}</td></tr>`).join('')+`<tr class="mean"><td>${b} 三题均值</td><td>${E(d.means[b].agent_config)}</td><td class="num">${d.means[b].expanded_tools.toFixed(2)}</td><td class="num">${d.means[b].score.toFixed(4)}</td></tr>`).join('');
}).catch(e=>{document.getElementById('rows').innerHTML=`<tr><td colspan="4">数据加载失败：${E(e.message)}</td></tr>`});
</script></main></body></html>

": "e053", "hand": "right", "start_s": 128.4, "end_s": 145.0, "action": "fasten", "object": "small_attachment", "evidence": [{"file": "front.mp4", "start_s": 128.4, "end_s": 145.0}, {"file": "top.mp4", "start_s": 128.4, "end_s": 145.0}], "note": "右手持续手指旋拧细小件；左手同时协助，是否完全到位不可见。"}, {"id": "e054", "hand": "left", "start_s": 145.0, "end_s": 145.8, "action": "pick_up", "object": "screwdriver", "evidence": [{"file": "front.mp4", "start_s": 145.0, "end_s": 145.8}, {"file": "top.mp4", "start_s": 145.0, "end_s": 145.8}], "note": "左手从桌面取起青绿柄螺丝刀。"}, {"id": "e055", "hand": "left", "start_s": 145.8, "end_s": 149.9, "action": "fasten", "object": "screwdriver", "evidence": [{"file": "front.mp4", "start_s": 145.8, "end_s": 149.9}, {"file": "top.mp4", "start_s": 145.8, "end_s": 149.9}], "note": "左手用青绿柄螺丝刀旋拧；右手扶持。"}, {"id": "e056", "hand": "left", "start_s": 149.9, "end_s": 150.65, "action": "put_down", "object": "screwdriver", "evidence": [{"file": "front.mp4", "start_s": 149.9, "end_s": 150.65}, {"file": "top.mp4", "start_s": 149.9, "end_s": 150.65}], "note": "左手把青绿柄螺丝刀放回桌面。"}, {"id": "e057", "hand": "left", "start_s": 150.65, "end_s": 159.2, "action": "fasten", "object": "small_attachment", "evidence": [{"file": "front.mp4", "start_s": 150.65, "end_s": 159.2}, {"file": "top.mp4", "start_s": 150.65, "end_s": 159.2}], "note": "左手继续在机体上手指旋拧／压紧小件；右手扶持。"}, {"id": "e058", "hand": "left", "start_s": 159.25, "end_s": 161.0, "action": "pick_up", "object": "handle", "evidence": [{"file": "front.mp4", "start_s": 159.25, "end_s": 161.0}, {"file": "top.mp4", "start_s": 159.25, "end_s": 161.0}], "note": "左手从红色4号料盒取出黑色长柄；盒内清空。"}, {"id": "e059", "hand": "left", "start_s": 161.0, "end_s": 162.35, "action": "adjust", "object": "handle", "evidence": [{"file": "front.mp4", "start_s": 161.0, "end_s": 162.35}, {"file": "top.mp4", "start_s": 161.0, "end_s": 162.35}], "note": "左手把长柄对到机体侧面的安装孔。"}, {"id": "e060", "hand": "left", "start_s": 162.35, "end_s": 164.9, "action": "fit", "object": "handle", "eviden for(const [k,v] of Object.entries(ACT))$('action').add(new Option(v,k));for(const [k,v] of Object.entries(OBJ))$('object').add(new Option(v,k));
function setTime(t){const p=$('player');if(p.readyState>=1)p.currentTime=t;else p.addEventListener('loadedmetadata',()=>p.currentTime=t,{once:true})}
function play(i){selected=events[i];if(!selected)return;const p=$('player'),path='media/'+view+'.mp4';if(p.getAttribute('src')!==path){p.src=path;p.load()}const a=selected.start_s,b=selected.end_s;if(Number.isFinite(a)){setTime(a);stop=Number.isFinite(b)?b:null}$('title').textContent=view+' · '+String(selected.id??i+1);$('clock').textContent=Number.isFinite(a)&&Number.isFinite(b)?`${a.toFixed(2)}–${b.toFixed(2)}秒；按播放键查看。`:'该条未给出可定位的完整时间。';history.replaceState(null,'','#event-'+encodeURIComponent(String(selected.id??i+1)))}

function draw(){const q=$('q').value.toLowerCase(),h=$('hand').value,a=$('action').value,o=$('object').value,filtered=events.map((x,i)=>({x,i})).filter(({x})=>(!h||x.hand===h)&&(!a||x.action===a)&&(!o||x.object===o)&&JSON.stringify(x).concat(ACT[x.action],OBJ[x.object]).toLowerCase().includes(q));$('count').textContent=filtered.length+' / '+events.length+'条';$('events').innerHTML=filtered.map(({x,i})=>`<article class="card item" id="event-${esc(x.id??i+1)}"><h3>${esc(x.id??i+1)} · ${esc(x.hand==='left'?'左手':x.hand==='right'?'右手':x.hand)} · ${esc(ACT[x.action]??x.action)}</h3><p>${esc(x.start_s)}–${esc(x.end_s)}秒 · ${esc(OBJ[x.object]??x.object)}</p><p>${esc(x.note??x.reason??x.description??'')}</p><button data-index="${i}">定位原片区间</button></article>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>play(Number(b.dataset.index)))}
for(const id of ['q','hand','action','object'])$(id).addEventListener(id==='q'?'input':'change',draw);for(const id of ['front','top'])$(id).onclick=()=>{view=id;if(selected)play(events.indexOf(selected));else{$('player').src='media/'+id+'.mp4';$('title').textContent=id}};draw();const id=decodeURIComponent(location.hash.slice(7));const ix=events.findIndex((x,i)=>String(x.id??i+1)===id);if(ix>=0)play(ix);

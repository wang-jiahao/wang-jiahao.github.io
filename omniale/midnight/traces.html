<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Midnight Note · 运行轨迹</title><style>
:root{--bg:#f4f3ee;--paper:#fffefa;--ink:#172c32;--muted:#647374;--line:#d9deda;--accent:#166f68;--soft:#e4efea;--warm:#b97131}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65}
main{max-width:1180px;margin:auto;padding:36px 40px 90px}
h1{font-size:33px;line-height:1.3;letter-spacing:-.02em;margin:0 0 10px;font-weight:650}
h2{font-size:21px;margin:38px 0 12px;font-weight:600;border-top:1px solid var(--line);padding-top:26px}
h3{font-size:16px;margin:22px 0 8px;font-weight:600}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:650;margin-bottom:10px}
.lead{color:#52686c;font-size:16.5px;max-width:900px}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--soft);padding:2px 9px;border-radius:4px;margin:0 6px 6px 0}
.tag.gray{background:#e9ece6;color:#52666b}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--paper);margin:6px 0 4px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
pre{white-space:pre-wrap;font-size:12.5px;background:var(--paper);border:1px solid var(--line);padding:14px;border-radius:6px;max-height:420px;overflow:auto}
img{max-width:100%;border:1px solid var(--line);background:#fff;border-radius:4px}
audio,video{width:100%}
details>summary{cursor:pointer;color:var(--accent);font-size:14px}
.ok{color:#166f68;font-weight:650}.no{color:var(--warm);font-weight:650}
.note{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:#e9ece6;color:#52666b;margin-left:6px}
.major{background:#f5e3d7;color:#9a4f17}

.event{border-top:1px solid var(--line);padding:12px 0}.event summary{font-family:monospace;white-space:pre-wrap;word-break:break-word}.event pre{max-height:650px}.event:target{background:var(--soft)}.controls{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:2}#count{font-size:13px;color:var(--muted)}.key-note{color:var(--accent);margin:8px 0}.stages{padding-left:24px}.stages li{margin:22px 0}.stage-links{font-size:12px;display:flex;gap:12px;flex-wrap:wrap}.find h2{border:0;margin:0 0 12px;padding:0;font-size:22px}
</style></head><body><main><a class="back" href="./">← 返回Midnight生成题</a><div class="eyebrow">企业协作与数字业务 / 音视频评审驱动网页生成</div><h1>运行轨迹</h1><p class="lead">先读过程总结，再看影响结果的关键步骤；所有可见命令和输出仍可展开核查。</p>
<div class="controls"><div class="toolbar"><label>模型 <select id="run"><option value="astra">Astra · 本轮独立测试</option><option value="sol-cmp">Sol · 本轮独立测试</option><option value="terra">Terra · 本轮独立测试</option><option value="sol">Sol · 早期探索（历史）</option></select></label><label>阅读方式 <select id="view"><option value="summary">过程总结</option><option value="key">关键步骤</option><option value="all">全部记录</option></select></label></div><div id="filters" class="toolbar" hidden><select id="kind"><option value="all">全部类型</option><option value="command">命令</option><option value="search">搜索</option><option value="message">可见回复</option><option value="error">失败命令</option></select><input id="search" type="search" placeholder="搜索命令或输出" aria-label="搜索轨迹"><span id="count"></span></div></div>
<p id="meta" class="note"></p><section id="overview" aria-live="polite"></section><div id="events" aria-live="polite"></div><p class="note">总结是依据可见证据整理的编辑说明。事件编号保持原顺序；不把未记录的看图调用计为零，不推测隐藏推理。</p></main><script src="trace-view.js"></script></body></html>
